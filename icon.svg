<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Shield Background -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="url(#glowGrad)" stroke-width="4" opacity="0.6" />

  <!-- Subtle WiFi Radar Waves -->
  <path d="M150 180 A 180 180 0 0 1 362 180" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.3" />
  <path d="M190 220 A 130 130 0 0 1 322 220" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.6" />
  <path d="M230 260 A 80 80 0 0 1 282 260" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" opacity="0.9" />

  <!-- Stylized Modern 'W' & 'B' Fiber Lightning Emblem -->
  <g filter="url(#glow)">
    <!-- W Wings Left -->
    <path d="M120 370 L170 240 L210 330 L256 220 L302 330 L342 240 L392 370" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Central Lightning Core -->
    <polygon points="256,150 286,250 246,250 270,350 226,240 266,240" fill="#facc15" filter="url(#glow)" />
    
    <!-- Core Fiber Node Pulse -->
    <circle cx="256" cy="380" r="16" fill="#38bdf8" />
  </g>
</svg>
